*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.75}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 60px}
.top{background:var(--primary);color:var(--on-primary);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.top .org{font-size:13px;opacity:.8}
.top h1{margin:2px 0 6px;font-size:20px;line-height:1.5;font-weight:700}
.top .principle{margin:0;font-size:13px;opacity:.88}
.ssot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.ssot .chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.ssot .chip small{display:block;color:var(--muted);font-size:12px}
.ssot .chip b{font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.tab{flex:1 0 auto;min-width:150px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:500;text-align:center}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.flow{font-size:12px;color:var(--muted);margin:0 2px 12px}
h2{font-size:17px;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card > .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.metric{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.metric small{display:block;color:var(--muted);font-size:12px}
.metric .v{font-size:17px;font-weight:700}
.metric .s{font-size:12px;color:var(--muted)}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.field{margin-bottom:10px}
.inrow{display:flex;gap:6px}
input[type=text],textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:42px}
input[type=text][dir=ltr]{text-align:right}
textarea{min-height:76px;resize:vertical}
input:disabled,textarea:disabled{background:var(--surface2);color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);min-height:18px}
.err{font-size:12px;color:var(--danger)}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:42px}

<body>
<div id="splash"><div><div id="sp-logo"></div><h1 class="pen">سامانه تصمیم‌یار قیمت‌گذاری و مشارکت در توسعه شبکه پذیرندگی سپ</h1><p class="pen">شهریور ۱۴۰۵ — طراح: مهدی نامدار</p></div><button class="skip" id="skip">ورود به داشبورد</button></div>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
/* ==========================================================================
   هسته محاسباتی و منطق کسب‌وکار سامانه تصمیم‌یار سپ
   - بدون وابستگی به DOM؛ تمام توابع خالص (pure) و قابل تست
   - نگاشت نام‌های مشخصات فنی:
       FINAL_SEP_TO_BROKER_PRICE      -> decision.finalPrice
       DECISION_STRATEGY              -> decision.strategy
       DECISION_DATE                  -> decision.decisionDate (شمسی)
       CEO_DECISION                   -> decision.ceoDecision
       MARKET_REFERENCE_AT_DECISION   -> decision.marketReference
       FX_REFERENCE_AT_DECISION       -> decision.fxReference
       PRICE_REFERENCE_AT_DECISION    -> decision.priceReference
   ========================================================================== */
const Core = (function () {
  'use strict';

  /* ---------- تعریف صریح پارامترهای تجاری (طبق مشخصات؛ بدون مقدار بازار/قیمت) ---------- */
  const CONFIG = Object.freeze({
    AGGRESSIVE_PERCENT_OF_MARKET: 100,
    CONSERVATIVE_PERCENT_OF_MARKET: 105,
    FX_SHARE_PERCENT: 40,
    RIAL_SHARE_PERCENT: 60,
    FX_BAND_PERCENT: 4,
    PACKAGES: Object.freeze([
      Object.freeze({ id: 'P2500', quantity: 2500, discountSharePercent: 100 }),
      Object.freeze({ id: 'P1000', quantity: 1000, discountSharePercent: 50 })
    ]),
    TOTAL_COMMITMENT: 60000,
    SEP_DEVICES: 30000,
    BROKER_DEVICES: 30000,
    MIN_ACTIVATION_PERCENT: 85,
    REMEDIATION_MONTHS: 2,
    PENALTY_SEP_SERIAL: 1000000,
    PENALTY_BROKER_SERIAL: 200000,
    LD_DEVICES: 30000,
    LD_UNIT: 1000000,
    LD_PERCENT: 120
  });

  const STATUS = Object.freeze({
    FX_IN_BAND: { icon: '🟢', label: 'داخل دامنه ثبات', tone: 'ok' },
    FX_REVIEW: { icon: '🟠', label: 'نیازمند بازنگری قیمت', tone: 'warn' },
    MKT_AGGRESSIVE: { icon: '🔵', label: 'منطبق با پیشنهاد قیمت تهاجمی', tone: 'info' },
    MKT_CONSERVATIVE: { icon: '🟣', label: 'منطبق با پیشنهاد قیمت محافظه‌کارانه', tone: 'purple' },
    MKT_INSIDE: { icon: '⚪', label: 'داخل دامنه قیمت پیشنهادی', tone: 'neutral' },
    MKT_OUTSIDE_BELOW: { icon: '🔴', label: 'خارج از دامنه قیمت بازار (پایین‌تر از دامنه)', tone: 'danger' },
    MKT_OUTSIDE_ABOVE: { icon: '🔴', label: 'خارج از دامنه قیمت بازار (بالاتر از دامنه)', tone: 'danger' },
    EXEC_DECISION: { icon: '⚑', label: 'نیازمند تصمیم مدیرعامل', tone: 'neutral' }
  });

  const STRATEGY_LABEL = Object.freeze({
    AGGRESSIVE: 'پیشنهاد قیمت تهاجمی',
    CONSERVATIVE: 'پیشنهاد قیمت محافظه‌کارانه',
    CEO: '✦ نظر مدیرعامل',
    KEEP_CURRENT: 'حفظ قیمت فعلی',
    ADOPT_FX_ADJUSTED: 'پذیرش قیمت تعدیل‌شده',
    CEO_CUSTOM: '✦ نظر مدیرعامل'
  });

  /* ---------- اعداد ---------- */
  const PD = '۰۱۲۳۴۵۶۷۸۹', AD = '٠١٢٣٤٥٦٧٨٩';
  function normalizeDigits(s) {
    return String(s)
      .replace(/[۰-۹]/g, function (c) { return PD.indexOf(c); })
      .replace(/[٠-٩]/g, function (c) { return AD.indexOf(c); })
      .replace(/[٬،,]/g, '')
      .replace(/٫/g, '.')
      .replace(/[\u200c\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '');
  }
  function parseNumber(s) {
    if (s === null || s === undefined) return NaN;
    if (typeof s === 'number') return s;
    const t = normalizeDigits(s).trim().replace(/\s+/g, '');
    if (t === '' || !/^-?\d+(\.\d+)?$/.test(t)) return NaN;
    return Number(t);
  }
  const isPos = function (x) { return typeof x === 'number' && Number.isFinite(x) && x > 0; };
  function roundToman(x) { return Math.round(x); }
  function formatNumber(n) {
    if (typeof n !== 'number' || !Number.isFinite(n)) return '—';
    let r = Math.round(n);
    if (Object.is(r, -0)) r = 0;
    return r.toLocaleString('en-US');
  }
  function formatToman(n) { return Number.isFinite(n) ? formatNumber(n) + ' تومان' : '—'; }
  function formatPercent(fraction, digits, sign) {
    if (typeof fraction !== 'number' || !Number.isFinite(fraction)) return '—';
    const d = digits === undefined ? 2 : digits;
    let v = Number((fraction * 100).toFixed(d));
    if (Object.is(v, -0)) v = 0;
    return (sign && v > 0 ? '+' : '') + String(v) + '%';
  }

  /* ---------- تقویم شمسی (الگوریتم استاندارد جلالی) ---------- */
  const div = function (a, b) { return ~~(a / b); };
  const mod = function (a, b) { return a - ~~(a / b) * b; };
  const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  function jalCal(jy, withoutLeap) {
    const bl = BREAKS.length, gy = jy + 621;
    let leapJ = -14, jp = BREAKS[0], jm, jump = 0, leap, leapG, march, n, i;
    if (jy < jp || jy >= BREAKS[bl - 1]) throw new Error('Invalid Jalaali year');
    for (i = 1; i < bl; i += 1) {
      jm = BREAKS[i]; jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    march = 20 + leapJ - leapG;
    if (withoutLeap) return { gy: gy, march: march };
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap: leap, gy: gy, march: march };
  }
  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy: gy, gm: gm, gd: gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy, true);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621, jd, jm, k;
    const r = jalCal(jy, false);
    const jdn1f = g2d(gy, 3, r.march);
    k = jdn - jdn1f;
    if (k >= 0) {
      if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy: jy, jm: jm, jd: jd }; }
      k -= 186;
    } else {
      jy -= 1; k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + div(k, 30); jd = mod(k, 30) + 1;
    return { jy: jy, jm: jm, jd: jd };
  }
  const pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

  function parseJalali(s) {
    if (s === null || s === undefined) return null;
    const t = normalizeDigits(s).trim().replace(/[-.\s]+/g, '/');
    const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(t);
    if (!m) return null;
    const jy = +m[1], jm = +m[2], jd = +m[3];
    if (jy < 1300 || jy > 1500 || jm < 1 || jm > 12 || jd < 1 || jd > 31) return null;
    const back = d2j(j2d(jy, jm, jd));
    if (back.jy !== jy || back.jm !== jm || back.jd !== jd) return null;
    return { jy: jy, jm: jm, jd: jd };
  }
  function formatJalaliObj(o) { return o.jy + '/' + pad2(o.jm) + '/' + pad2(o.jd); }
  function normJalali(s) { const o = parseJalali(s); return o ? formatJalaliObj(o) : null; }
  function jalaliLong(s) { const o = parseJalali(s); return o ? o.jd + ' ' + MONTHS[o.jm - 1] + ' ' + o.jy : null; }
  function jalaliToJdn(s) { const o = parseJalali(s); return o ? j2d(o.jy, o.jm, o.jd) : NaN; }
  function gregorianToJalali(gy, gm, gd) { return formatJalaliObj(d2j(g2d(gy, gm, gd))); }
  function jalaliToGregorian(s) { const o = parseJalali(s); if (!o) return null; const g = d2g(j2d(o.jy, o.jm, o.jd)); return g.gy + '-' + pad2(g.gm) + '-' + pad2(g.gd); }
  function todayJalali() { const d = new Date(); return gregorianToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  function addDaysJalali(s, n) { const o = parseJalali(s); return formatJalaliObj(d2j(j2d(o.jy, o.jm, o.jd) + n)); }

  /* ---------- اعتبارسنجی ---------- */
  function checkPrice(v, label) {
    if (!isPos(v)) return label + ' باید عددی بزرگ‌تر از صفر باشد.';
    if (!Number.isInteger(v)) return label + ' باید عدد صحیح (تومان) باشد.';
    return null;
  }
  function validateDraft(inputs) {
    const sep = parseNumber(inputs.sepPrice), mk = parseNumber(inputs.marketPrice), fx = parseNumber(inputs.fxAtDecision);
    return {
      sepPrice: checkPrice(sep, 'قیمت اولیه سپ'),
      marketPrice: checkPrice(mk, 'قیمت مرجع بازار'),
      pricingDate: normJalali(inputs.pricingDate) ? null : 'تاریخ قیمت‌گذاری شمسی نامعتبر است (نمونه: 1405/06/28).',
      fxAtDecision: checkPrice(fx, 'نرخ دلار روز تصمیم')
    };
  }
  function validateMarkup(raw) {
    if (raw === '' || raw === null || raw === undefined) return { ok: false, empty: true, message: 'درصد X در جلسه تعیین می‌شود؛ مقدار پیش‌فرض ندارد.' };
    const x = parseNumber(raw);
    if (!Number.isFinite(x) || x < 0) return { ok: false, empty: false, message: 'درصد X باید عددی صفر یا مثبت باشد.' };
    return { ok: true, value: x };
  }

  /* ---------- تب ۱: قلب قیمت‌گذاری ---------- */
  function marketPosition(price, market) {
    const min = market * CONFIG.AGGRESSIVE_PERCENT_OF_MARKET / 100;
    const max = market * CONFIG.CONSERVATIVE_PERCENT_OF_MARKET / 100;
    const p = Math.round(price), lo = Math.round(min), hi = Math.round(max);
    let code;
    if (p < lo) code = 'MKT_OUTSIDE_BELOW';
    else if (p > hi) code = 'MKT_OUTSIDE_ABOVE';
    else if (p === lo) code = 'MKT_AGGRESSIVE';
    else if (p === hi) code = 'MKT_CONSERVATIVE';
    else code = 'MKT_INSIDE';
    return { code: code, inRange: code.indexOf('OUTSIDE') < 0, min: min, max: max };
  }
  function computePricing(a) {
    const errors = [];
    if (!isPos(a.sepPrice)) errors.push({ field: 'sepPrice', message: 'قیمت اولیه سپ باید عددی بزرگ‌تر از صفر باشد.' });
    if (!isPos(a.marketPrice)) errors.push({ field: 'marketPrice', message: 'قیمت مرجع بازار باید عددی بزرگ‌تر از صفر باشد؛ محاسبات وابسته غیرفعال است.' });
    if (errors.length) return { ok: false, errors: errors };
    const aggressive = a.marketPrice * CONFIG.AGGRESSIVE_PERCENT_OF_MARKET / 100;
    const conservative = a.marketPrice * CONFIG.CONSERVATIVE_PERCENT_OF_MARKET / 100;
    const gap = a.sepPrice - a.marketPrice;
    const corr = Math.max(0, gap);
    return {
      ok: true, sepPrice: a.sepPrice, marketPrice: a.marketPrice,
      gap: gap, gapPercent: gap / a.marketPrice, aboveMarket: gap > 0,
      requiredCorrection: corr, requiredCorrectionPercent: corr / a.sepPrice,
      aggressive: aggressive, conservative: conservative,
      range: { min: aggressive, max: conservative },
      sepPosition: marketPosition(a.sepPrice, a.marketPrice)
    };
  }

  /* ---------- تب ۲: تصمیم مدیرعامل ---------- */
  function evaluatePriceAgainstRange(price, pricing) {
    const msg = checkPrice(price, 'قیمت وارد‌شده');
    if (msg) return { valid: false, message: msg };
    if (!pricing || !pricing.ok) return { valid: false, message: 'ابتدا ورودی‌های تب ۱ را کامل کنید.' };
    const pos = marketPosition(price, pricing.marketPrice);
    const lo = Math.round(pricing.range.min), hi = Math.round(pricing.range.max);
    let direction = 'INSIDE', deviationAmount = 0, boundValue = null;
    if (pos.code === 'MKT_OUTSIDE_BELOW') { direction = 'BELOW'; deviationAmount = lo - price; boundValue = lo; }
    if (pos.code === 'MKT_OUTSIDE_ABOVE') { direction = 'ABOVE'; deviationAmount = price - hi; boundValue = hi; }
    return {
      valid: true, inRange: pos.inRange, code: pos.code, direction: direction,
      deviationAmount: deviationAmount, deviationPercent: boundValue ? deviationAmount / boundValue : 0,
      boundValue: boundValue, vsMarketPercent: (price - pricing.marketPrice) / pricing.marketPrice,
      vsSepPercent: (price - pricing.sepPrice) / pricing.sepPrice, vsSepAmount: price - pricing.sepPrice
    };
  }
  function computeCandidate(pricing, ui) {
    if (!pricing.ok) return { valid: false, reason: 'PRICING_INVALID' };
    if (ui.strategy === 'AGGRESSIVE') return { valid: true, strategy: 'AGGRESSIVE', price: roundToman(pricing.aggressive) };
    if (ui.strategy === 'CONSERVATIVE') return { valid: true, strategy: 'CONSERVATIVE', price: roundToman(pricing.conservative) };
    if (ui.strategy === 'CEO') {
      const raw = String(ui.ceoPrice === undefined ? '' : ui.ceoPrice).trim();
      if (raw === '') return { valid: false, strategy: 'CEO', reason: 'EMPTY' };
      const p = parseNumber(raw);
      const m = checkPrice(p, 'قیمت نظر مدیرعامل');
      if (m) return { valid: false, strategy: 'CEO', reason: 'INVALID', message: m };
      return { valid: true, strategy: 'CEO', price: p };
    }
    return { valid: false, reason: 'NONE' };
  }
  /* تخفیف کل = قیمت اولیه سپ − قیمت نهایی مصوب (حداقل صفر).
     بزرگ‌ترین بسته ۱۰۰٪ تخفیف کل و بسته کوچک‌تر ۵۰٪ آن را می‌گیرد. */
  function computePackages(sepPrice, finalPrice) {
    if (!isPos(sepPrice) || !isPos(finalPrice)) return { ok: false, rows: [] };
    const totalDiscount = Math.max(0, sepPrice - finalPrice);
    return {
      ok: true, totalDiscount: totalDiscount, noDiscount: totalDiscount === 0,
      rows: CONFIG.PACKAGES.map(function (p) {
        const discountUnit = totalDiscount * p.discountSharePercent / 100;
        const unit = sepPrice - discountUnit;
        return { id: p.id, quantity: p.quantity, discountSharePercent: p.discountSharePercent, listPrice: sepPrice, discountUnit: discountUnit, unitPrice: unit, total: unit * p.quantity };
      })
    };
  }
  function brokerMarketPrice(finalPrice, markupRaw) {
    const v = validateMarkup(markupRaw);
    if (!v.ok) return { ok: false, empty: v.empty, message: v.message };
    if (!isPos(finalPrice)) return { ok: false, empty: false, message: 'قیمت نهایی مصوب هنوز مشخص نیست.' };
    return { ok: true, markup: v.value, price: finalPrice * (100 + v.value) / 100 };
  }

  /* ---------- تب ۳: ارز و بازنگری ---------- */
  function fxAdjustedPrice(base, refFx, newFx) {
    if (!isPos(base) || !isPos(refFx) || !isPos(newFx)) return NaN;
    return base * (CONFIG.RIAL_SHARE_PERCENT * refFx + CONFIG.FX_SHARE_PERCENT * newFx) / (100 * refFx);
  }
  function fxBand(refFx) {
    return { low: refFx * (100 - CONFIG.FX_BAND_PERCENT) / 100, high: refFx * (100 + CONFIG.FX_BAND_PERCENT) / 100 };
  }
  function fxOutsideBand(refFx, newFx) { return Math.abs(newFx - refFx) * 100 > refFx * CONFIG.FX_BAND_PERCENT; }
  function evaluateFxPoint(refFx, fx) {
    const outside = fxOutsideBand(refFx, fx);
    return { change: (fx - refFx) / refFx, outside: outside, code: outside ? 'FX_REVIEW' : 'FX_IN_BAND' };
  }
  function evaluateReview(decision, snap, currentApproved) {
    const ref = decision.fxReference, base = decision.priceReference;
    const fxp = evaluateFxPoint(ref, snap.fx);
    const adjusted = fxAdjustedPrice(base, ref, snap.fx);
    const pos = marketPosition(adjusted, snap.market);
    const curPos = isPos(currentApproved) ? marketPosition(currentApproved, snap.market) : null;
    const statuses = [fxp.code, pos.code];
    const requiresDecision = fxp.outside || !pos.inRange;
    if (requiresDecision) statuses.push('EXEC_DECISION');
    return {
      change: fxp.change, outside: fxp.outside, band: fxBand(ref), adjusted: adjusted,
      marketRange: { min: pos.min, max: pos.max }, position: pos, currentPosition: curPos,
      statuses: statuses, requiresDecision: requiresDecision
    };
  }

  /* ---------- تعهدات و ریسک ---------- */
  function commitments() {
    return {
      total: CONFIG.TOTAL_COMMITMENT,
      minActive: Math.ceil(CONFIG.TOTAL_COMMITMENT * CONFIG.MIN_ACTIVATION_PERCENT / 100),
      liquidated: CONFIG.LD_DEVICES * CONFIG.LD_UNIT * CONFIG.LD_PERCENT / 100
    };
  }
  function simulateCommitment(x) {
    const c = commitments();
    const active = parseNumber(x.active), sepS = parseNumber(x.sepSerials), brS = parseNumber(x.brokerSerials), com = parseNumber(x.commission);
    const out = { minActive: c.minActive };
    if (Number.isFinite(active) && active >= 0 && active <= c.total) {
      out.activationRate = active / c.total; out.activationOk = active >= c.minActive; out.shortfall = Math.max(0, c.minActive - active);
    }
    const okN = function (v) { return Number.isFinite(v) && v >= 0 && Number.isInteger(v); };
    if (okN(sepS) && okN(brS)) {
      out.penaltyTotal = sepS * CONFIG.PENALTY_SEP_SERIAL + brS * CONFIG.PENALTY_BROKER_SERIAL;
      const commission = Number.isFinite(com) && com >= 0 ? com : 0;
      out.fromCommission = Math.min(out.penaltyTotal, commission);
      out.fromLiquidated = Math.min(out.penaltyTotal - out.fromCommission, c.liquidated);
      out.uncovered = out.penaltyTotal - out.fromCommission - out.fromLiquidated;
      out.liquidatedRemaining = c.liquidated - out.fromLiquidated;
    }
    return out;
  }

  /* ---------- درون‌ریزی گروهی ---------- */
  function parseImport(text) {
    const rows = [], errors = [];
    String(text || '').split(/\r?\n/).forEach(function (line, idx) {
      if (line.trim() === '') return;
      const tokens = line.trim().split(/[\t;|\s]+/).map(function (t) { return t.replace(/[,،]+$/, ''); }).filter(Boolean);
      const at = 'سطر ' + (idx + 1) + ': ';
      if (tokens.length !== 3) { errors.push(at + 'قالب باید «تاریخ شمسی، نرخ دلار، قیمت مرجع بازار» باشد.'); return; }
      const jd = normJalali(tokens[0]), fx = parseNumber(tokens[1]), mk = parseNumber(tokens[2]);
      if (!jd) { errors.push(at + 'تاریخ شمسی نامعتبر است.'); return; }
      const e1 = checkPrice(fx, 'نرخ دلار'), e2 = checkPrice(mk, 'قیمت بازار');
      if (e1) { errors.push(at + e1); return; }
      if (e2) { errors.push(at + e2); return; }
      rows.push({ jdate: jd, fx: fx, market: mk });
    });
    return { rows: rows, errors: errors };
  }

  /* ---------- وضعیت (state) و عملیات بدون تغییر در ورودی ---------- */
  function emptyState() {
    return {
      schema: 1,
      inputs: { sepPrice: '', marketPrice: '', pricingDate: '', fxAtDecision: '' },
      decision: null,
      brokerMarkup: '',
      snapshots: [],
      versions: [],
      minutes: { meetingDate: '' },
      archive: [],
      ui: {
        tab: 1, strategy: null, ceoPrice: '', decisionNote: '', confirming: false, confirmingNew: false,
        reviewDate: '', reviewFx: '', reviewMarket: '', importText: '', showImport: false,
        versionSnap: null, versionChoice: 'KEEP', versionCustom: '', versionNotes: '', selectedPoint: null,
        sim: { active: '', sepSerials: '', brokerSerials: '', commission: '' }
      }
    };
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function migrate(s) {
    const base = emptyState();
    const out = Object.assign(base, s);
    out.inputs = Object.assign(base.inputs, s.inputs || {});
    out.minutes = Object.assign({ meetingDate: '' }, s.minutes || {});
    out.ui = Object.assign(emptyState().ui, s.ui || {});
    out.ui.sim = Object.assign(emptyState().ui.sim, (s.ui && s.ui.sim) || {});
    return out;
  }
  function fail(errors) { return { ok: false, errors: errors }; }

  function confirmDecision(state, p) {
    if (state.decision) return fail(['تصمیم قبلاً ثبت شده است؛ برای تصمیم جدید ابتدا تصمیم فعلی بایگانی شود.']);
    const v = validateDraft(state.inputs);
    const errs = Object.keys(v).map(function (k) { return v[k]; }).filter(Boolean);
    if (errs.length) return fail(errs);
    const sep = parseNumber(state.inputs.sepPrice), market = parseNumber(state.inputs.marketPrice), fx = parseNumber(state.inputs.fxAtDecision);
    const jdate = normJalali(state.inputs.pricingDate);
    const pricing = computePricing({ sepPrice: sep, marketPrice: market });
    if (!pricing.ok) return fail(pricing.errors.map(function (e) { return e.message; }));
    let final, ceoEval = null;
    if (p.strategy === 'AGGRESSIVE') final = roundToman(pricing.aggressive);
    else if (p.strategy === 'CONSERVATIVE') final = roundToman(pricing.conservative);
    else if (p.strategy === 'CEO') {
      final = parseNumber(p.ceoPrice);
      const m = checkPrice(final, 'قیمت نظر مدیرعامل');
      if (m) return fail([m]);
      ceoEval = evaluatePriceAgainstRange(final, pricing);
    } else return fail(['یکی از سه گزینه تصمیم را انتخاب کنید.']);

    const next = clone(state);
    const outside = ceoEval ? !ceoEval.inRange : !evaluatePriceAgainstRange(final, pricing).inRange;
    next.decision = {
      id: 'D' + (state.archive.length + 1),
      strategy: p.strategy,
      decisionDate: jdate,
      confirmedAt: p.nowISO || null,
      finalPrice: final,
      priceReference: final,
      sepPrice: sep,
      marketReference: market,
      fxReference: fx,
      aggressive: pricing.aggressive,
      conservative: pricing.conservative,
      gap: pricing.gap,
      gapPercent: pricing.gapPercent,
      requiredCorrection: pricing.requiredCorrection,
      ceoDecision: {
        kind: STRATEGY_LABEL[p.strategy], price: final, outsideRange: outside,
        deviationAmount: ceoEval ? ceoEval.deviationAmount : 0,
        deviationPercent: ceoEval ? ceoEval.deviationPercent : 0,
        direction: ceoEval ? ceoEval.direction : 'INSIDE',
        note: String(p.note || '').trim()
      }
    };
    next.versions = [{
      id: 'V1', type: 'DECISION', jdate: jdate, previousPrice: null,
      fxReference: fx, currentFx: fx, market: market, adjustedPrice: final,
      marketRange: { min: pricing.range.min, max: pricing.range.max },
      approvedPrice: final, strategy: p.strategy, statusCodes: ['FX_IN_BAND'], snapshotId: null,
      notes: String(p.note || '').trim() || 'تصمیم اولیه قیمت‌گذاری', createdAt: p.nowISO || null
    }];
    next.ui.confirming = false;
    return { ok: true, state: next };
  }

  function addSnapshot(state, p) {
    if (!state.decision) return fail(['ابتدا تصمیم قیمت در تب ۲ ثبت شود.']);
    const jd = normJalali(p.jdate), fx = parseNumber(p.fx), mk = parseNumber(p.market);
    const errs = [];
    if (!jd) errs.push('تاریخ بازنگری شمسی نامعتبر است (نمونه: 1405/07/15).');
    const e1 = checkPrice(fx, 'نرخ دلار روز'); if (e1) errs.push(e1);
    const e2 = checkPrice(mk, 'قیمت مرجع بازار روز'); if (e2) errs.push(e2);
    if (errs.length) return fail(errs);
    const next = clone(state);
    const id = 'S' + (state.snapshots.length + 1);
    next.snapshots.push({ id: id, jdate: jd, fx: fx, market: mk, source: p.source || 'دستی', createdAt: p.nowISO || null });
    next.ui.versionSnap = null;
    next.ui.selectedPoint = id;
    return { ok: true, state: next, id: id };
  }
  function addSnapshots(state, rows, nowISO) {
    let s = state;
    for (let i = 0; i < rows.length; i++) {
      const r = addSnapshot(s, { jdate: rows[i].jdate, fx: rows[i].fx, market: rows[i].market, source: 'درون‌ریزی', nowISO: nowISO });
      if (!r.ok) return r;
      s = r.state;
    }
    return { ok: true, state: s };
  }
  function currentApprovedPrice(state) {
    return state.versions.length ? state.versions[state.versions.length - 1].approvedPrice : null;
  }
  function registerVersion(state, p) {
    if (!state.decision) return fail(['ابتدا تصمیم قیمت در تب ۲ ثبت شود.']);
    const snap = state.snapshots.filter(function (s) { return s.id === p.snapshotId; })[0];
    if (!snap) return fail(['عکس‌برداری بازار انتخاب‌شده وجود ندارد.']);
    if (state.versions.some(function (v) { return v.snapshotId === snap.id; })) return fail(['برای این بازنگری قبلاً نسخه قیمت ثبت شده است؛ نسخه‌ها تغییر نمی‌کنند.']);
    const prev = currentApprovedPrice(state);
    const ev = evaluateReview(state.decision, snap, prev);
    let approved, strategy;
    if (p.choice === 'KEEP') { approved = prev; strategy = 'KEEP_CURRENT'; }
    else if (p.choice === 'ADOPT') {
      if (!ev.outside) return fail(['در داخل دامنه ±' + CONFIG.FX_BAND_PERCENT + '٪ قیمت فعلی ثابت می‌ماند؛ پذیرش قیمت تعدیل‌شده فقط پس از خروج از دامنه ممکن است.']);
      approved = roundToman(ev.adjusted); strategy = 'ADOPT_FX_ADJUSTED';
    } else if (p.choice === 'CUSTOM') {
      approved = parseNumber(p.customPrice);
      const m = checkPrice(approved, 'قیمت نظر مدیرعامل'); if (m) return fail([m]);
      strategy = 'CEO_CUSTOM';
    } else return fail(['نوع تصمیم بازنگری را انتخاب کنید.']);
    const next = clone(state);
    next.versions.push({
      id: 'V' + (state.versions.length + 1), type: 'REVIEW', jdate: snap.jdate, previousPrice: prev,
      fxReference: state.decision.fxReference, currentFx: snap.fx, market: snap.market,
      adjustedPrice: ev.adjusted, marketRange: ev.marketRange, approvedPrice: approved,
      strategy: strategy, statusCodes: ev.statuses.slice(), snapshotId: snap.id,
      notes: String(p.notes || '').trim(), createdAt: p.nowISO || null
    });
    next.ui.versionNotes = ''; next.ui.versionCustom = ''; next.ui.versionSnap = null;
    return { ok: true, state: next };
  }
  function startNewSession(state, nowISO) {
    if (!state.decision) return fail(['تصمیمی برای بایگانی وجود ندارد.']);
    const fresh = emptyState();
    fresh.archive = clone(state.archive);
    fresh.archive.push({
      archivedAt: nowISO || null, decision: clone(state.decision), snapshots: clone(state.snapshots),
      versions: clone(state.versions), brokerMarkup: state.brokerMarkup, inputs: clone(state.inputs), minutes: clone(state.minutes)
    });
    return { ok: true, state: fresh };
  }

  /* ---------- سری نمودار ---------- */
  function buildChartSeries(state) {
    const d = state.decision;
    if (!d) return [];
    const pts = [{ id: 'D', jdate: d.decisionDate, fx: d.fxReference, label: 'تصمیم اولیه', order: 0 }];
    state.snapshots.forEach(function (s, i) { pts.push({ id: s.id, jdate: s.jdate, fx: s.fx, label: 'بازنگری ' + (i + 1), order: i + 1 }); });
    pts.forEach(function (p) {
      const e = evaluateFxPoint(d.fxReference, p.fx);
      p.change = e.change; p.outside = e.outside; p.status = STATUS[e.code].label; p.statusCode = e.code; p.jdn = jalaliToJdn(p.jdate);
    });
    pts.sort(function (a, b) { return a.jdn - b.jdn || a.order - b.order; });
    return pts;
  }

  /* ---------- مشتقات (تنها منبع خواندن برای همه تب‌ها) ---------- */
  function derive(state) {
    const d = state.decision;
    const sepPrice = d ? d.sepPrice : parseNumber(state.inputs.sepPrice);
    const marketPrice = d ? d.marketReference : parseNumber(state.inputs.marketPrice);
    const fxRef = d ? d.fxReference : parseNumber(state.inputs.fxAtDecision);
    const pricing = computePricing({ sepPrice: sepPrice, marketPrice: marketPrice });
    const candidate = d ? { valid: true, strategy: d.strategy, price: d.finalPrice, locked: true } : computeCandidate(pricing, state.ui);
    const basePrice = d ? d.finalPrice : (candidate.valid ? candidate.price : null);
    const candidateEval = candidate.valid && pricing.ok ? evaluatePriceAgainstRange(candidate.price, pricing) : null;
    const packages = computePackages(sepPrice, basePrice);
    const broker = brokerMarketPrice(basePrice, state.brokerMarkup);
    const currentApproved = currentApprovedPrice(state);
    const latest = state.snapshots.length ? state.snapshots[state.snapshots.length - 1] : null;
    const review = d && latest ? evaluateReview(d, latest, currentApproved) : null;
    return {
      hasDecision: !!d, sepPrice: sepPrice, marketPrice: marketPrice, fxRef: fxRef, pricing: pricing,
      draftErrors: d ? {} : validateDraft(state.inputs), candidate: candidate, candidateEval: candidateEval,
      basePrice: basePrice, packages: packages, broker: broker, currentApproved: currentApproved,
      latest: latest, review: review, commitments: commitments()
    };
  }

  /* ---------- نمونه آزمون (فقط با فرمان کاربر بارگذاری می‌شود) ---------- */
  function sampleScenario(state, todayJ) {
    const s = clone(state);
    s.inputs = { sepPrice: '5000000', marketPrice: '4000000', pricingDate: todayJ, fxAtDecision: '230000' };
    s.ui.strategy = 'CEO'; s.ui.ceoPrice = '3700000'; s.brokerMarkup = '10';
    return s;
  }
  function sampleImportText(decisionDate) {
    const rows = [[3, 232000, 4000000], [10, 236500, 4020000], [17, 241000, 4150000], [24, 246000, 4250000], [31, 238000, 4180000]];
    return rows.map(function (r) { return addDaysJalali(decisionDate, r[0]) + '، ' + r[1] + '، ' + r[2]; }).join('\n');
  }

  return {
    CONFIG: CONFIG, STATUS: STATUS, STRATEGY_LABEL: STRATEGY_LABEL,
    normalizeDigits: normalizeDigits, parseNumber: parseNumber, isPos: isPos, roundToman: roundToman,
    formatNumber: formatNumber, formatToman: formatToman, formatPercent: formatPercent,
    parseJalali: parseJalali, normJalali: normJalali, jalaliLong: jalaliLong, jalaliToJdn: jalaliToJdn,
    gregorianToJalali: gregorianToJalali, jalaliToGregorian: jalaliToGregorian, todayJalali: todayJalali, addDaysJalali: addDaysJalali,
    validateDraft: validateDraft, validateMarkup: validateMarkup, checkPrice: checkPrice,
    marketPosition: marketPosition, computePricing: computePricing, evaluatePriceAgainstRange: evaluatePriceAgainstRange,
    computeCandidate: computeCandidate, computePackages: computePackages, brokerMarketPrice: brokerMarketPrice,
    fxAdjustedPrice: fxAdjustedPrice, fxBand: fxBand, fxOutsideBand: fxOutsideBand, evaluateFxPoint: evaluateFxPoint, evaluateReview: evaluateReview,
    commitments: commitments, simulateCommitment: simulateCommitment, parseImport: parseImport,
    emptyState: emptyState, migrate: migrate, clone: clone,
    confirmDecision: confirmDecision, addSnapshot: addSnapshot, addSnapshots: addSnapshots, registerVersion: registerVersion,
    startNewSession: startNewSession, currentApprovedPrice: currentApprovedPrice,
    buildChartSeries: buildChartSeries, derive: derive, sampleScenario: sampleScenario, sampleImportText: sampleImportText
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Core;

</script>
<script>
(function () {
  'use strict';
  const KEY = 'sep_dss_state_v1';
  const LOGO_SRC = 'icons/logo-sep.png'; /* لوگوی رسمی سپ — PNG */
  const logoHtml = function () { return LOGO_SRC ? '<img class="logo-img" alt="لوگوی سپ" src="' + LOGO_SRC + '">' : '<div class="logo-fb" aria-label="لوگوی سپ (جایگاه موقت)">سپ</div>'; };
  const $app = document.getElementById('app'), $tip = document.getElementById('tip');
  let state = load();
  let flash = null;

  /* ---------- ذخیره‌سازی ---------- */
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.schema === 1) return Core.migrate(s); } } catch (e) { /* حافظه در دسترس نیست */ }
    return Core.emptyState();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
  function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function setPath(o, p, v) {
    const next = Core.clone(o), parts = p.split('.'); let x = next;
    for (let i = 0; i < parts.length - 1; i++) x = x[parts[i]];
    x[parts[parts.length - 1]] = v; return next;
  }
  const nowISO = function () { return new Date().toISOString(); };

  /* ---------- کمک‌ها ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  const NA = '<span class="muted">ثبت نشده</span>';
  const num = function (s) { return '<span class="num">' + esc(s) + '</span>'; };
  const T = function (n) { return Number.isFinite(n) ? num(Core.formatNumber(n)) + ' تومان' : NA; };
  const PC = function (x, d, sg) { return Number.isFinite(x) ? num(Core.formatPercent(x, d === undefined ? 2 : d, sg)) : NA; };
  const DT = function (j) { return j ? num(j) : NA; };

      field({ id: 'in-ceo', label: 'قیمت دلخواه (تومان)', bind: 'ui.ceoPrice', kind: 'num', disabled: locked, error: D.candidate.strategy === 'CEO' && D.candidate.reason === 'INVALID' ? D.candidate.message : '', hint: locked ? '' : 'هر عدد معتبری پذیرفته می‌شود.' }) + '</div></div>' +

  /* ---------- تب ۳ ---------- */
  function chart(D) {
    const d = state.decision, series = Core.buildChartSeries(state);
    window.__series = series;
    const W = Math.max(300, Math.min(900, ($app.clientWidth || 360) - 34)), H = 290, m = { l: 70, r: 26, t: 40, b: 46 };
    const band = Core.fxBand(d.fxReference);
    let min = Math.min.apply(null, [band.low].concat(series.map(function (p) { return p.fx; })));
    let max = Math.max.apply(null, [band.high].concat(series.map(function (p) { return p.fx; })));
    const pad = (max - min) * 0.12; min -= pad; max += pad;
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const X = function (i) { return m.l + (series.length === 1 ? iw / 2 : i * iw / (series.length - 1)); };
    const Y = function (v) { return m.t + (max - v) / (max - min) * ih; };
    const selId = state.ui.selectedPoint && series.some(function (p) { return p.id === state.ui.selectedPoint; }) ? state.ui.selectedPoint : series[series.length - 1].id;
    const sameYear = series.every(function (p) { return p.jdate.slice(0, 4) === series[0].jdate.slice(0, 4); });
    const step = Math.max(1, Math.ceil(series.length / Math.max(1, Math.floor(iw / 64))));

    }
    [[band.high, '+4%'], [band.low, '-4%']].forEach(function (b) {

      case 'confirmCancel': upd('ui.confirming', false); break;
      case 'confirmDo': {
        const r = Core.confirmDecision(state, { strategy: ui.strategy, ceoPrice: ui.ceoPrice, note: ui.decisionNote, nowISO: nowISO() });
        if (r.ok) { commit(setPath(r.state, 'ui.tab', 3), okf('تصمیم ثبت شد. قیمت نهایی مصوب و مراجع ارزی برای بازنگری‌های آینده ذخیره شدند.')); window.scrollTo(0, 0); } else commit(setPath(state, 'ui.confirming', false), fail(r.errors));
        break;
      }
      case 'newAsk': upd('ui.confirmingNew', true); break;
      case 'newCancel': upd('ui.confirmingNew', false); break;
      case 'newDo': { const r = Core.startNewSession(state, nowISO()); if (r.ok) commit(r.state, okf('تصمیم قبلی بایگانی شد.')); break; }
      case 'loadSample': if (!state.decision) commit(Core.sampleScenario(state, Core.todayJalali()), { kind: 'info', items: ['سناریوی نمونه بارگذاری شد؛ این مقادیر آزمایشی‌اند و پیش‌فرض تجاری سامانه نیستند.'] }); break;
      case 'clearDraft': if (!state.decision) { const n = Core.clone(state); n.inputs = Core.emptyState().inputs; n.ui.strategy = null; n.ui.ceoPrice = ''; n.brokerMarkup = ''; commit(n, null); } break;
      case 'addSnapshot': {
        const r = Core.addSnapshot(state, { jdate: ui.reviewDate, fx: ui.reviewFx, market: ui.reviewMarket, source: 'دستی', nowISO: nowISO() });
        if (r.ok) { const n = r.state; n.ui.reviewFx = ''; n.ui.reviewMarket = ''; commit(n, okf('بازار روز به‌عنوان عکس‌برداری جدید ثبت شد.')); } else commit(state, fail(r.errors));
        break;
      }
      case 'toggleImport': upd('ui.showImport', !ui.showImport); break;
      case 'importSample': if (state.decision) upd('ui.importText', Core.sampleImportText(state.decision.decisionDate)); break;
      case 'importDo': {
        const p = Core.parseImport(ui.importText);
        if (p.errors.length || !p.rows.length) { commit(state, fail(p.errors.length ? p.errors : ['هیچ سطری برای ثبت وجود ندارد.'])); break; }
        const r = Core.addSnapshots(state, p.rows, nowISO());
        if (r.ok) { r.state.ui.importText = ''; commit(r.state, okf(p.rows.length + ' بازار روز ثبت شد.')); } else commit(state, fail(r.errors));
        break;
      }
      case 'pickSnap': upd('ui.versionSnap', ds.id); break;
      case 'choose': upd('ui.versionChoice', ds.choice); break;
      case 'registerVersion': {
        const pending = state.snapshots.filter(function (s) { return !state.versions.some(function (v) { return v.snapshotId === s.id; }); });
        const snapId = pending.some(function (s) { return s.id === ui.versionSnap; }) ? ui.versionSnap : (pending.length ? pending[pending.length - 1].id : null);
        const r = Core.registerVersion(state, { snapshotId: snapId, choice: ui.versionChoice, customPrice: ui.versionCustom, notes: ui.versionNotes, nowISO: nowISO() });
        if (r.ok) commit(r.state, okf('نسخه جدید قیمت ثبت شد؛ نسخه‌های قبلی بدون تغییر ماندند.')); else commit(state, fail(r.errors));
        break;
      }
      case 'selectPoint': upd('ui.selectedPoint', ds.id); break;
      case 'pdf': exportPdf(); break;
      case 'print': try { window.print(); } catch (err) { /* ignore */ } break;
    }
  });
  function showTip(e) {
    const el = e.target.closest && e.target.closest('[data-idx]');
    if (!el || !window.__series) { $tip.style.display = 'none'; return; }
    const p = window.__series[+el.dataset.idx]; if (!p) return;
    $tip.innerHTML = 'تاریخ: ' + num(p.jdate) + '<br>نرخ دلار: ' + num(Core.formatNumber(p.fx)) + '<br>تغییر از مرجع: ' + num(Core.formatPercent(p.change, 2, true)) + '<br>' + esc(p.status);
    $tip.style.display = 'block';
    $tip.style.left = Math.min(window.innerWidth - 250, Math.max(6, e.clientX + 12)) + 'px'; $tip.style.top = (e.clientY + 14) + 'px';
  }
  document.addEventListener('mouseover', showTip); document.addEventListener('mousemove', showTip);
  document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('[data-idx]')) $tip.style.display = 'none'; });
  let rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(render, 150); });

  render();
  const sp = document.getElementById('splash');
  document.getElementById('sp-logo').innerHTML = logoHtml();
  const closeSplash = function () { sp.classList.add('hide'); setTimeout(function () { sp.style.display = 'none'; }, 800); };
  document.getElementById('skip').addEventListener('click', closeSplash);
  setTimeout(closeSplash, 5000);
})();

</script>
